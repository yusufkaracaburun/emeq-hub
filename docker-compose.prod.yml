# Prod-stack — eigen server, achter Cloudflare via een Cloudflare Tunnel.
#   make prod-deploy          (of: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build)
#
# cloudflared bouwt een uitgaande verbinding naar Cloudflare; er hoeft geen poort
# open te staan en het server-IP blijft verborgen. CF termineert TLS aan de rand en
# praat versleuteld met de tunnel; de app serveert plain HTTP op :80 binnen het
# compose-netwerk. Laravel detecteert https via trustProxies (bootstrap/app.php)
# + APP_URL=https://hub.emeq.nl.
#
# Let op: Cloudflare's Bot Fight Mode (free) challenge't server-to-server-verkeer en
# breekt partner-webhooks. Houd 'm UIT op deze zone — hij kan niet per pad worden
# uitgezonderd. Zie docs/deployment.md § Cloudflare.
services:
  app:
    build:
      context: .
      target: prod
    image: emeq-hub-app:prod
    restart: unless-stopped
    # Resource-plafonds (12 GB / 6 vCore-box): begrenst een lekkende Octane-worker
    # zodat db/redis niet mee-OOM'en. Ceilings, geen reserveringen.
    mem_limit: 3g
    cpus: 3.0
    security_opt:
      - no-new-privileges:true
    env_file: .env.prod
    # spatie/laravel-backup schrijft naar /app/backups; het prod-image bakt de
    # code in (geen source-mount), dus zonder dit bind-mount landt de dump in de
    # ephemeral container en is 'ie weg bij redeploy. Deelt de host-`backups/`-dir
    # met `make prod-backup` (gitignored, rsync-excluded, OVH-snapshot-gedekt).
    volumes:
      - ./backups:/app/backups
    # Geen publieke poort: verkeer komt via de tunnel. De loopback-bind is er
    # alleen voor de smoke-test op de server zelf (curl http://127.0.0.1:8090/up).
    # 8080 bewust vermeden — dat is op meerdere hosts al van een reverse proxy.
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      # Expliciet op 200 testen: `curl -fsS` faalt alleen op 4xx/5xx en slikt een
      # 3xx, dus een redirect-lus kwam er als "healthy" doorheen.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost/up)\" = 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Uitgaande connector naar Cloudflare. Locally-managed: de ingress-regel
  # (hub.emeq.nl → http://app:80) staat in docker/cloudflared.yml, in git. Het
  # credentials-bestand is een secret en staat in .cloudflared/ op de server
  # (gitignored). Zie docs/deployment.md § Tunnel.
  cloudflared:
    image: cloudflare/cloudflared:2026.7.1
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./docker/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./.cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      app:
        condition: service_healthy

  horizon:
    image: emeq-hub-app:prod
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    env_file: .env.prod
    command: php artisan horizon
    # De base-image (FrankenPHP) levert een curl-healthcheck op :2019/metrics — die
    # host draait hier geen Caddy, dus vervangen door een echte liveness-probe.
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'is running'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: emeq-hub-app:prod
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    env_file: .env.prod
    # schedule:work tikt elke minuut `schedule:run`; geen system-cron nodig.
    # Draait o.a. books:generate-recurring-invoices (dailyAt 06:00) en de
    # dagelijkse spatie-backup — die moet naar de persistente host-`backups/`-dir.
    volumes:
      - ./backups:/app/backups
    command: php artisan schedule:work
    # schedule:work heeft geen status-commando en de image mist pgrep; check dat de
    # artisan-stack boot (crash van de PID-1-loop → container-restart, niet stil dood).
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list > /dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
