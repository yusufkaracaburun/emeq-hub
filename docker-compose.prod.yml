# Prod-stack — eigen server, achter Cloudflare via een Cloudflare Tunnel.
#   make prod-deploy          (of: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build)
#
# cloudflared bouwt een uitgaande verbinding naar Cloudflare; er hoeft geen poort
# open te staan en het server-IP blijft verborgen. CF termineert TLS aan de rand en
# praat versleuteld met de tunnel naar traefik, die op :80 naar `app` routeert.
# Laravel detecteert https via trustProxies (bootstrap/app.php) + APP_URL=
# https://hub.emeq.nl. Traefik zit ertussen puur voor de health-gated swap
# tijdens een deploy (`docker rollout`, zie Makefile) — zie zijn eigen comment
# hieronder voor waarom.
#
# Let op: Cloudflare's Bot Fight Mode (free) challenge't server-to-server-verkeer en
# breekt partner-webhooks. Houd 'm UIT op deze zone — hij kan niet per pad worden
# uitgezonderd. Zie docs/deployment.md § Cloudflare.
services:
  app:
    build:
      context: .
      target: prod
    image: emeq-hub-app:prod
    restart: unless-stopped
    # Resource-plafonds (12 GB / 6 vCore-box): begrenst een lekkende Octane-worker
    # zodat db/redis niet mee-OOM'en. Ceilings, geen reserveringen.
    mem_limit: 3g
    cpus: 3.0
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    env_file: .env.prod
    environment:
      # SSR draait als eigen service; de app praat er over het compose-netwerk
      # mee. Staat hier en niet in .env.prod omdat het een compose-topologie-
      # detail is, geen deployment-secret.
      INERTIA_SSR_ENABLED: "true"
      INERTIA_SSR_URL: http://ssr:13714
    # spatie/laravel-backup schrijft naar /app/backups; het prod-image bakt de
    # code in (geen source-mount), dus zonder dit bind-mount landt de dump in de
    # ephemeral container en is 'ie weg bij redeploy. Deelt de host-`backups/`-dir
    # met `make prod-backup` (gitignored, rsync-excluded, OVH-snapshot-gedekt).
    volumes:
      - ./backups:/app/backups
    # Geen `ports:` — Traefik routeert (zie hieronder) en `docker rollout` (#109)
    # staat geen host-poort op deze service toe: een tweede instance tijdens de
    # swap zou botsen op dezelfde bind. Handmatige smoke-test op de server:
    # `docker compose exec app curl http://localhost/up`.
    labels:
      # Expliciete port-label is verplicht: het prod-image EXPOSEt geen poort
      # (zie Dockerfile `prod`-target), dus Traefik kan 'm niet auto-detecteren.
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`hub.emeq.nl`)"
      - "traefik.http.services.app.loadbalancer.server.port=80"
    healthcheck:
      # Expliciet op 200 testen: `curl -fsS` faalt alleen op 4xx/5xx en slikt een
      # 3xx, dus een redirect-lus kwam er als "healthy" doorheen.
      #
      # `/tmp/drain`-check is er voor container-draining tijdens `docker rollout`
      # (#109, Makefile `--pre-stop-hook`): zonder dat verdween de oude container
      # soms terwijl Traefik nog naar 'm routeerde — lokaal gemeten 5 mislukte
      # requests (502/000) in het venster van "oude container stopt" tot "Traefik
      # heeft het gemerkt". Met deze check zet de pre-stop-hook de container zelf
      # eerst op "unhealthy" (Traefik sluit 'm uit, nog vóórdat 'ie stopt) en pas
      # daarna stopt docker-rollout 'm. interval/retries verlaagd (was 30s/3) zodat
      # die exclusie snel genoeg is — de pre-stop-hook-sleep in de Makefile moet
      # langer zijn dan interval × retries.
      test: ["CMD-SHELL", "test ! -f /tmp/drain && test \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost/up)\" = 200"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Geen service_healthy: valt SSR weg, dan rendert Inertia client-side
      # door. Wachten zou de app onnodig blokkeren.
      ssr:
        condition: service_started

  # Inertia SSR-server (Node). Zonder deze service serveert de publieke surface
  # een lege body aan crawlers die geen JavaScript uitvoeren — GPTBot,
  # ClaudeBot, PerplexityBot en de link-unfurlers van Slack/LinkedIn. Valt hij
  # om, dan degradeert Inertia naar client-side rendering: de site blijft
  # werken voor bezoekers, alleen de crawler-HTML is dan leeg.
  ssr:
    build:
      context: .
      target: ssr
    image: emeq-hub-ssr:prod
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:13714/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Health-gated reverse proxy vóór `app`, puur t.b.v. zero-downtime deploys
  # (#109). cloudflared praat alleen met traefik — geen host-poort nodig, dus
  # geen groter aanvalsoppervlak dan de bestaande tunnel-only opzet. Traefik's
  # Docker-provider sluit een container met Docker-healthcheck-status
  # "starting"/"unhealthy" automatisch uit van routering: dát mechanisme is
  # waarom `docker rollout app` (zie Makefile `prod-up`) een nieuwe container
  # pas in het verkeer zet zodra hij gezond is, en de oude pas verwijdert
  # nadat de nieuwe het overneemt.
  #
  # Docker-socket-mount (`:ro`) geeft de container leesrechten op alle
  # container-metadata inclusief env-vars van andere services — bewuste
  # afweging, geen dashboard/API aan om het aanvalsoppervlak te beperken.
  # Hardening-optie voor later: Tecnativa/docker-socket-proxy ertussen.
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      # Zonder dit overschrijft Traefik cloudflared's X-Forwarded-Proto: https
      # met http (de scheme van zijn eigen, interne verbinding met cloudflared),
      # waardoor Laravel's trustProxies overal http detecteert. Veilig hier:
      # dit entrypoint heeft geen host-poort, alleen cloudflared kan 'm raken.
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--ping=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Uitgaande connector naar Cloudflare. Locally-managed: de ingress-regel
  # (hub.emeq.nl → http://traefik:80) staat in docker/cloudflared.yml, in git.
  # Het credentials-bestand is een secret en staat in .cloudflared/ op de
  # server (gitignored). Zie docs/deployment.md § Tunnel.
  cloudflared:
    image: cloudflare/cloudflared:2026.7.1
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./docker/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./.cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      traefik:
        condition: service_healthy

  horizon:
    image: emeq-hub-app:prod
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    env_file: .env.prod
    command: php artisan horizon
    stop_grace_period: 75s
    # De base-image (FrankenPHP) levert een curl-healthcheck op :2019/metrics — die
    # host draait hier geen Caddy, dus vervangen door een echte liveness-probe.
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'is running'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: emeq-hub-app:prod
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    env_file: .env.prod
    # schedule:work tikt elke minuut `schedule:run`; geen system-cron nodig.
    # Draait o.a. books:generate-recurring-invoices (dailyAt 06:00) en de
    # dagelijkse spatie-backup — die moet naar de persistente host-`backups/`-dir.
    volumes:
      - ./backups:/app/backups
    command: php artisan schedule:work
    # schedule:work heeft geen status-commando en de image mist pgrep; check dat de
    # artisan-stack boot (crash van de PID-1-loop → container-restart, niet stil dood).
    healthcheck:
      test: ["CMD-SHELL", "php artisan schedule:list > /dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
