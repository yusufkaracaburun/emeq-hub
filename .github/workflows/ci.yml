name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests · Pint · Audit
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, bcmath, gd, curl, dom, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # api.json staat in git zodat elke contractwijziging een reviewbare diff is.
      # Het script is deterministisch (servers vastgepind in config/scramble.php,
      # API_VERSION hard gezet), dus een diff betekent een echte API-wijziging.
      - name: OpenAPI spec in sync
        run: |
          bin/export-openapi.sh
          git diff --exit-code -- api.json \
            || { echo "::error::api.json is verouderd — draai bin/export-openapi.sh en commit het resultaat."; exit 1; }

      # Vangt fouten in de generatie zelf (exit 1), die anders stilletjes een
      # kapotte of onvolledige spec zouden opleveren. Staat vandaag op groen.
      - name: Analyse OpenAPI generation
        run: php artisan scramble:analyze

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Level 5 met een baseline van 206 bestaande hits: nieuwe code moet schoon
      # zijn, bestaande schuld blokkeert de build niet.
      - name: Static analysis (PHPStan/Larastan)
        run: composer stan

      - name: Run tests
        run: php artisan test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Composer security audit
        run: composer audit

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SC1091 (kan gesourcete file niet volgen) is informational en niet oplosbaar
      # zonder de runtime-omgeving — bewust uitgesloten.
      - name: Run ShellCheck
        run: shellcheck -e SC1091 bin/*.sh
