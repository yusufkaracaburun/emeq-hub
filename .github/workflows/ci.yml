name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests · Pint · Audit
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # postgres:16-alpine matcht docker-compose.yml — zelfde driver-gedrag als
      # lokaal/prod i.p.v. sqlite, om drift tussen omgevingen te voorkomen.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emeq_hub
          POSTGRES_USER: emeq_hub
          POSTGRES_PASSWORD: emeq_hub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U emeq_hub -d emeq_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, intl, bcmath, gd, curl, dom, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # RefreshDatabase draait `migrate:fresh`; een eigen database voorkomt dat
      # een testrun de "emeq_hub"-database van deze stap zelf leegveegt.
      - name: Create test database
        run: PGPASSWORD=emeq_hub psql -h 127.0.0.1 -p 5433 -U emeq_hub -d emeq_hub -c "CREATE DATABASE emeq_hub_testing;"

      # api.json staat in git zodat elke contractwijziging een reviewbare diff is.
      # Het script is hermetisch (servers, API_VERSION en database staan vast),
      # dus een diff betekent een echte API-wijziging. Fouten in de generatie
      # zelf laten `scramble:export` non-zero eindigen, dus een aparte
      # `scramble:analyze` zou hier niets extra's bewaken.
      - name: OpenAPI spec in sync
        run: |
          bin/export-openapi.sh
          git diff --exit-code -- api.json \
            || { echo "::error::api.json is verouderd — draai bin/export-openapi.sh en commit het resultaat."; exit 1; }

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Level 5 met een baseline van 206 bestaande hits: nieuwe code moet schoon
      # zijn, bestaande schuld blokkeert de build niet.
      - name: Static analysis (PHPStan/Larastan)
        run: composer stan

      - name: Run tests
        run: php artisan test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Composer security audit
        run: composer audit

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SC1091 (kan gesourcete file niet volgen) is informational en niet oplosbaar
      # zonder de runtime-omgeving — bewust uitgesloten.
      - name: Run ShellCheck
        run: shellcheck -e SC1091 bin/*.sh
