; Dunne dev-overlay bovenop php.ini-production. Houdt dev debuggable + reloadbaar
; terwijl de rest van de runtime identiek aan prod blijft.
display_errors = On
opcache.validate_timestamps = 1
; Hoger dan de production-128M zodat de testsuite + artisan-commando's lokaal draaien.
memory_limit = 512M
