services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-emeq_hub}"
      POSTGRES_USER: "${DB_USERNAME:-emeq_hub}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-emeq_hub}"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2
    ports:
      - "${CADDY_PORT:-8090}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8091}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
