services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-emeq_hub}"
      POSTGRES_USER: "${DB_USERNAME:-emeq_hub}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-emeq_hub}"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2
    ports:
      - "${CADDY_PORT:-8090}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: emeq-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8091}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@emeq.test}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-emeq_hub}"
      # Desktop-mode: geen per-user login, geen master-password-prompt (lokaal dev).
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Pre-registreert de `db`-server (equivalent van adminer's ADMINER_DEFAULT_SERVER).
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  pgadmindata:
