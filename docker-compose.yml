# Dev-stack — alles in Docker, prod-like (FrankenPHP worker-mode + Octane).
# Source bind-mounted → code-changes zonder rebuild; `watch` in de dev-Caddyfile
# herstart de worker. React via de aparte vite-service (HMR).
#
# DB_HOST/REDIS_HOST worden hier naar de container-namen overschreven; de host-.env
# blijft 127.0.0.1:5433/6380 zodat host-tinker/tests blijven werken.
services:
  app:
    build:
      context: .
      target: dev
    command: frankenphp run --config /app/docker/Caddyfile.dev
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-8092}:80"
    environment:
      SERVER_NAME: ":80"
      OCTANE_SERVER: frankenphp
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    # queue:listen boot per job fresh → pakt code-changes zonder restart, node-vrij.
    # Zelfde redis-queue + jobs als prod-horizon; prod supervised via `php artisan horizon`.
    # Expliciet beide queues: prod-Horizon heeft supervisor-1 (default) +
    # supervisor-webhooks (webhooks) — zónder --queue pakt listen alleen 'default'
    # en blijven fan-out + webhook-subscription-lifecycle-jobs hangen (dev/prod-drift).
    command: php artisan queue:listen --queue=default,webhooks --tries=1 --timeout=0
    # Het FrankenPHP-image healthcheckt de webserver; deze service draait geen web → uit.
    healthcheck:
      disable: true
    volumes:
      - .:/app
    environment:
      OCTANE_SERVER: frankenphp
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  vite:
    image: node:22-slim
    working_dir: /app
    # npm ci muteert package-lock niet (geen name-churn); conditional = alleen 1e boot.
    command: sh -c "[ -d node_modules/.bin ] || npm ci; npm run dev -- --host"
    volumes:
      - .:/app
      # Anonymous volume maskeert de host-(darwin)node_modules → container krijgt
      # eigen linux-binaries (esbuild/rollup), anders crasht Vite op arch-mismatch.
      - /app/node_modules
    ports:
      - "5173:5173"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-emeq_hub}"
      POSTGRES_USER: "${DB_USERNAME:-emeq_hub}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-emeq_hub}"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.15.0
    container_name: emeq-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8091}:80"
    environment:
      # NB: geen .test/.local hier — pgAdmin weigert reserved TLDs (RFC 6761).
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@emeq.nl}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-emeq_hub}"
      # Desktop-mode: geen per-user login, geen master-password-prompt (lokaal dev).
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Pre-registreert de `db`-server (equivalent van adminer's ADMINER_DEFAULT_SERVER).
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  redisdata:
  pgadmindata:
